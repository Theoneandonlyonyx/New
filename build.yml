name: build-jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repo holen
        uses: actions/checkout@v4

      - name: Alle ZIPs im Hauptordner entpacken
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Entpacke $z"
            unzip -o -q "$z"
          done
          echo "--- gefundene build.gradle:"
          find . -name build.gradle -not -path './.git/*'

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.1.1

      - name: Jar bauen
        run: |
          F=$(find . -name build.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "Keine build.gradle gefunden. Liegt die ZIP im Hauptordner des Repos?"
            exit 1
          fi
          cd "$(dirname "$F")"
          gradle build --no-daemon

      - name: Jar zum Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: "**/build/libs/*.jar"
          if-no-files-found: error
